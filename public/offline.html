<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você está Offline - Body Métrica FJ</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
        }
        h1 {
            color: #3b82f6;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #9ca3af;
            margin-bottom: 2rem;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MODO OFFLINE</h1>
        <p>Você parece estar sem conexão com a internet. Verifique sua rede e tente novamente.</p>
        <button onclick="window.location.reload()">TENTAR NOVAMENTE</button>
    </div>
</body>
</html>
