<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você está Offline - Body Métrica FJ</title>
    <style>
        body {
            background-color: #0a1317;
            color: #edf5f6;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
        }
        h1 {
            color: #22b8cc;
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        p {
            color: #9db1b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        button {
            background-color: #22b8cc;
            color: #052227;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modo offline</h1>
        <p>Você parece estar sem conexão com a internet. Verifique sua rede e tente novamente.</p>
        <button onclick="window.location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
